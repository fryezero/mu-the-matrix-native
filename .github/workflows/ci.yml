name: Recovery tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install portable dependencies
        run: python -m pip install -r tools/requirements-portable.txt
      - name: Install Crypto++ on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypto++-dev gcc-mingw-w64-i686 libjpeg-dev
      - name: Install Crypto++ on macOS
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cryptopp sdl2 jpeg-turbo
      - name: Build and test without game files
        run: make test PYTHON=python
      - name: Cross-build x86 guest comparison tool
        if: runner.os == 'Linux'
        run: make -C runtime-linux/lea-compare
      - name: Cross-build immediate-mode batching proxy
        if: runner.os == 'Linux'
        run: make mugl mac-diagnostics mac-hotpatch
      - name: Cross-build authored performance probes
        if: runner.os == 'Linux'
        run: |
          i686-w64-mingw32-gcc -O2 -fno-tree-vectorize -mfpmath=387 '-DMODE="x87"' mac-play/diagnostics/fpbench.c -o /tmp/fp_x87.exe
          i686-w64-mingw32-gcc -O2 -fno-tree-vectorize -msse2 -mfpmath=sse '-DMODE="SSE2"' mac-play/diagnostics/fpbench.c -o /tmp/fp_sse.exe
          i686-w64-mingw32-gcc -O2 -msse2 -mfpmath=sse mac-play/diagnostics/glbench.c -o /tmp/glbench.exe -lopengl32 -lgdi32
      - name: Build the windowed native viewer
        if: runner.os == 'macOS'
        run: make native-viewer
      - name: Compile authored Mach profiling tools
        if: runner.os == 'macOS'
        run: make -C mac-play/machprof
      - name: Check repository publication boundary
        run: python scripts/audit_repository.py
