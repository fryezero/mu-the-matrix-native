name: Recovery tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install portable dependencies
        run: python -m pip install -r tools/requirements-portable.txt
      - name: Install Crypto++ on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypto++-dev
      - name: Install Crypto++ on macOS
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cryptopp
      - name: Build and test without game files
        run: make test PYTHON=python
      - name: Check repository publication boundary
        run: python scripts/audit_repository.py
